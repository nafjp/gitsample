<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在庫管理システム</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        form { display: inline-block; margin-right: 5px;}
        .action-form input[type='number'] { width: 60px; }
        .add-item-form label { display: block; margin-top: 10px; }
        .add-item-form input[type='text'], .add-item-form input[type='number'] { width: 200px; padding: 8px; margin-top: 5px; }
        .add-item-form button { margin-top: 10px; padding: 10px 15px; }
        h1, h2 { color: #333; }
    </style>
</head>
<body>
    <h1>在庫管理システム</h1>

    <h2>現在の在庫</h2>
    {% if inventory %}
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>商品名</th>
                <th>数量</th>
                <th>単価 (円)</th>
                <th>アクション</th>
            </tr>
        </thead>
        <tbody>
            {% for item in inventory %}
            <tr>
                <td>{{ item.id }}</td>
                <td>{{ item.name }}</td>
                <td>
                    <form action="{{ url_for('update_item', item_id=item.id) }}" method="post" class="action-form">
                        <input type="number" name="quantity" value="{{ item.quantity }}" min="0" required>
                        <button type="submit">更新</button>
                    </form>
                </td>
                <td>{{ "%.2f"|format(item.unit_price) }}</td>
                <td>
                    <form action="{{ url_for('delete_item', item_id=item.id) }}" method="post" class="action-form">
                        <button type="submit" onclick="return confirm('本当にこの商品を削除しますか？');">削除</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    {% else %}
    <p>在庫に商品がありません。</p>
    {% endif %}

    <h2>商品を追加</h2>
    <form action="{{ url_for('add_item') }}" method="post" class="add-item-form">
        <div>
            <label for="name">商品名:</label>
            <input type="text" id="name" name="name" required>
        </div>
        <div>
            <label for="quantity">数量:</label>
            <input type="number" id="quantity" name="quantity" min="0" required>
        </div>
        <div>
            <label for="unit_price">単価 (円):</label>
            <input type="number" id="unit_price" name="unit_price" min="0" step="0.01" required>
        </div>
        <button type="submit">追加</button>
    </form>

</body>
</html>
