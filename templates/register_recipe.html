<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Recipe</title>
</head>
<body>
    <h1>Register New Recipe</h1>
    <form action="{{ url_for('register_form') }}" method="post" enctype="multipart/form-data">
        <div>
            <label for="recipe_name">Recipe Name:</label>
            <input type="text" id="recipe_name" name="recipe_name" required>
        </div>
        <div>
            <label for="recipe_image">Recipe Image:</label>
            <input type="file" id="recipe_image" name="recipe_image">
        </div>
        <div>
            <h2>Material 1</h2>
            <div>
                <label for="material1_name">Name:</label>
                <input type="text" id="material1_name" name="material1_name" required>
            </div>
            <div>
                <label for="material1_price">Price:</label>
                <input type="number" id="material1_price" name="material1_price" required>
            </div>
            <div>
                <label for="material1_expiry">Days to Expiry:</label>
                <input type="number" id="material1_expiry" name="material1_expiry" required>
            </div>
        </div>
        <button type="submit">Register Recipe</button>
    </form>
</body>
</html>
